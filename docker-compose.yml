services:
  webscraper-app:
    build: .
    container_name: webscraper-saas
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=webscraper_super_secret_key_2024
    volumes:
      - ./data:/app/data
    networks:
      - npm-network

networks:
  npm-network:
    external: true
    name: nginx-proxy-manager_default
